name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Install dependencies and build web app
      run: |
        npm install
        npm run build

    - name: Install Capacitor and add Android platform
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "MyApp" "com.example.myapp" --web-dir=dist
        npx cap add android
        # Фикс конфликта версий Kotlin
        echo "configurations.all { resolutionStrategy { force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.20'; force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.20'; force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.20' } }" >> android/build.gradle
        npx cap sync android

    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
